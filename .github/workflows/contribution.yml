# Source only: publication, hosted execution and runner costs require maintainer approval.
# A reviewer must independently pin this file, the checker and package.json; these files cannot approve themselves.
name: Contribution CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: contribution-${{ github.repository_id }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contribution:
    name: Contribution checks
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      CI: 'true'
      NODE_OPTIONS: ''
      WRANGLER_SEND_METRICS: 'false'
      CF_VITE_DISABLE_CONFIG_FETCH: 'true'
      OG_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      OG_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      OG_CI_TESTED_SHA: ${{ github.sha }}
      OG_CI_PR_NUMBER: ${{ github.event.pull_request.number }}
      OG_CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      OG_CI_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
    steps:
      - name: Checkout exact PR merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, official tag verified 2026-10-11
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify checkout identity ${{ github.sha }}
        timeout-minutes: 1
        run: |
          test "$(git rev-parse --verify HEAD)" = "$OG_CI_TESTED_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$OG_CI_TESTED_SHA $OG_CI_BASE_SHA $OG_CI_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        timeout-minutes: 10
        run: npm run install:ci
      - name: Run fixed contribution checks ${{ github.sha }}
        timeout-minutes: 82
        env:
          OG_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OG_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OG_CI_TESTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse --verify HEAD)" = "$OG_CI_TESTED_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$OG_CI_TESTED_SHA $OG_CI_BASE_SHA $OG_CI_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          node scripts/check-contribution.mjs "$OG_CI_BASE_SHA" "$OG_CI_HEAD_SHA" "$OG_CI_TESTED_SHA" "$RUNNER_TEMP/contribution-report.json"
